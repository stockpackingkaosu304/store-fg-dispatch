<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Store Layout - WMS [Premium]</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* 🎨 1. Dynamic Theme Engine (แก้ปัญหาคอนทราสต์สีกลืนกัน) */
        :root{
            --cell: 22px;      /* grid unit, matches 1 excel column/row */
            --cols: 47;
            --rows: 30;

            /* ☀️ Light Theme: พื้นสว่าง ตัวหนังสือเข้ม */
            --bg-gradient: linear-gradient(-45deg, #f8fafc, #e2e8f0, #cbd5e1, #f1f5f9);
            --glass-bg: rgba(255, 255, 255, 0.85);
            --glass-border: rgba(0, 0, 0, 0.1);
            --input-bg: rgba(255, 255, 255, 0.95);
            --text-main: #0f172a;
            --text-sub: #475569;
            --card-hover: rgba(241, 245, 249, 1);
            --glow-color: rgba(14, 165, 233, 0.15);
        }
        [data-theme="dark"] {
            /* 🌙 Dark Theme: พื้นมืด ตัวหนังสือสว่าง */
            --bg-gradient: linear-gradient(-45deg, #0f172a, #1e293b, #020617, #0f172a);
            --glass-bg: rgba(30, 41, 59, 0.7);
            --glass-border: rgba(255, 255, 255, 0.15);
            --input-bg: rgba(15, 23, 42, 0.8);
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --card-hover: rgba(51, 65, 85, 0.9);
            --glow-color: rgba(56, 189, 248, 0.15);
        }
        [data-theme="kaosu"] {
            /* 🔴 Kaosu Theme */
            --bg-gradient: linear-gradient(-45deg, #450a0a, #7f1d1d, #220303, #450a0a);
            --glass-bg: rgba(69, 10, 10, 0.8);
            --glass-border: rgba(250, 204, 21, 0.3);
            --input-bg: rgba(0, 0, 0, 0.6);
            --text-main: #fef08a;
            --text-sub: #fca5a5;
            --card-hover: rgba(127, 29, 29, 0.9);
            --glow-color: rgba(250, 204, 21, 0.15);
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: var(--bg-gradient); background-size: 400% 400%; animation: gradientBG 15s ease infinite;
            color: var(--text-main); overflow: hidden; transition: color 0.3s ease, background 0.5s ease;
        }
        @keyframes gradientBG { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

        /* 🪞 2. Glassmorphism Utilities */
        .glass-panel { background: var(--glass-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid var(--glass-border); box-shadow: 0 10px 25px -5px rgba(0,0,0,0.2); transition: all 0.3s ease; }
        .glass-input { background: var(--input-bg); border: 1px solid var(--glass-border); color: var(--text-main); backdrop-filter: blur(8px); transition: all 0.3s ease; }
        .glass-input:focus { border-color: #38bdf8; box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2); }
        .mouse-glow { position: fixed; top: var(--y, 50%); left: var(--x, 50%); transform: translate(-50%, -50%); width: 600px; height: 600px; background: radial-gradient(circle, var(--glow-color) 0%, transparent 60%); pointer-events: none; z-index: 0; }

        /* ===== Interactive boxes (A1-xx / A2-xx racks, Lift, Roll Container) — white, clickable ===== */
        .rack-box {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-size: 10px; line-height: 1.05; text-align: center;
            font-weight: 800; color: #0f172a;
            cursor: pointer; background-color: #ffffff;
            transition: all 0.15s ease; border: 1.5px solid #475569;
            box-sizing: border-box; position: relative; z-index: 5;
            padding: 1px; overflow: hidden;
        }
        /* ✅ จำกัด hover effect ไว้เฉพาะอุปกรณ์ที่มีเมาส์จริง (desktop) เท่านั้น
           เพื่อไม่ให้จอสัมผัส (มือถือ/แท็บเล็ต) เกิดอาการ "เด้ง" ค้างตอนแตะ */
        @media (hover: hover) and (pointer: fine) {
            .rack-box:hover { background-color: #38bdf8; color: white; z-index: 30; box-shadow: 0 0 10px #0ea5e9; }
            .rack-box.type-lift:hover { background-color: #a78bfa; color: white; box-shadow: 0 0 10px #7c3aed; }
            .rack-box.type-lift:hover .box-icon { color: white; }
        }
        .rack-box.narrow-vert span { writing-mode: vertical-rl; text-orientation: mixed; letter-spacing: 0.02em; }
        .rack-box .box-icon { font-size: 12px; margin-bottom: 2px; }

        /* Cargo lift boxes */
        .rack-box.type-lift { background-color: #c4b5fd; color: #312e81; border-color: #7c3aed; }
        .rack-box.type-lift .box-icon { color: #4c1d95; font-size: 14px; }

        .status-empty { background-color: #4ade80 !important; color: #042f1a; }
        .status-partial { background-color: #facc15 !important; color: #422006; }
        .status-full { background-color: #f87171 !important; color: #4c0505; }
        .status-unknown { background-color: #e2e8f0; color: #64748b; }

        .highlight-blink {
            animation: blinker 0.8s linear infinite;
            background-color: #0ea5e9 !important; color: white !important;
            box-shadow: 0 0 20px #0ea5e9; z-index: 40 !important; border-color: #0284c7;
        }
        @keyframes blinker { 50% { opacity: 0.4; } }

        /* ===== Static zone / room / machine boxes ===== */
        .zone-box { display:flex; align-items:center; justify-content:center; text-align:center; font-size: 8.5px; line-height:1.1; font-weight:700; color:#94a3b8; background: rgba(51,65,85,0.55); border: 1px dashed #475569; box-sizing:border-box; padding:2px; overflow:hidden; border-radius:2px; }
        .toilet-box { display:flex; align-items:center; justify-content:center; font-size: 8.5px; font-weight:700; color:#94a3b8; background: rgba(30,41,59,0.9); border: 1px solid #334155; box-sizing:border-box; }
        .void-box { display:flex; align-items:center; justify-content:center; text-align:center; font-size: 8.5px; font-weight:700; color:#334155; background: repeating-linear-gradient(45deg, rgba(51,65,85,0.15), rgba(51,65,85,0.15) 10px, transparent 10px, transparent 20px); border: 1px dashed #334155; box-sizing:border-box; border-radius:2px; }

        .building-position-wrapper{ position: relative; }
        .floor-badge-outside{ position:absolute; left:2px; top:-30px; z-index:25; padding: 4px 12px; font-size:11px; font-weight:900; border-radius:8px; letter-spacing:.05em; white-space:nowrap; box-shadow: 0 3px 8px rgba(0,0,0,0.5); }

        /* ===== 3D scene scaffolding ===== */
        .scene-container { perspective: 2300px; perspective-origin: 50% 50%; width: calc(var(--cell) * var(--cols)); height: calc(var(--cell) * var(--rows)); }
        /* ✅ ตัด transition ออกจาก scale-wrapper เพราะตอนบีบนิ้วซูม (pinch) เราอัปเดต transform
           ถี่มาก (ทุก touchmove) การมี transition 0.1s ทำให้ค่าที่ตั้งใหม่ไล่ตามค่าเก่าไม่ทัน
           เกิดอาการกระตุก/หน่วง ให้ปล่อยให้ transform เปลี่ยนทันทีแทน (สมูทกว่าเดิมมาก) */
        #scale-wrapper { transition: none; }
        .building-3d { position: relative; transform-style: preserve-3d; width: calc(var(--cell) * var(--cols)); height: calc(var(--cell) * var(--rows)); transition: transform 0.8s cubic-bezier(0.25, 1, 0.5, 1); }
        .floor-layer {
            position: absolute; top: 0; left: 0; width: calc(var(--cell) * var(--cols)); height: calc(var(--cell) * var(--rows));
            background: rgba(30, 41, 59, 0.9); border: 3px solid #64748b; box-shadow: 0 25px 50px rgba(0,0,0,0.8);
            transform-style: preserve-3d; transition: all 0.8s cubic-bezier(0.25, 1, 0.5, 1); display: grid;
            grid-template-columns: repeat(var(--cols), var(--cell)); grid-template-rows: repeat(var(--rows), var(--cell));
        }
        .floor-layer::before { content: ''; position: absolute; top: 100%; left: -3px; right: -3px; height: 20px; background: #0f172a; transform-origin: top; transform: rotateX(-90deg); border: 1px solid #334155; }
        .floor-layer::after { content: ''; position: absolute; top: -3px; bottom: -3px; right: -20px; width: 20px; background: #334155; transform-origin: left; transform: rotateY(90deg); border: 1px solid #1e293b; }

        .state-3d { transform: rotateX(42deg) rotateZ(-16deg) translateZ(0px) translateY(-20px); }
        .state-3d #floor1-layer { transform: translateZ(-110px); opacity: 1; }
        .state-3d #floor2-layer { transform: translateZ(200px); opacity: 1; }

        .state-f1 { transform: rotateX(0deg) rotateZ(0deg) translateZ(0px); }
        .state-f1 #floor1-layer { transform: translateZ(0px); opacity: 1; z-index: 10; background: rgba(15, 23, 42, 1); }
        .state-f1 #floor2-layer { transform: translateZ(500px); opacity: 0; pointer-events: none; }

        .state-f2 { transform: rotateX(0deg) rotateZ(0deg) translateZ(0px); }
        .state-f2 #floor1-layer { transform: translateZ(-500px); opacity: 0; pointer-events: none; }
        .state-f2 #floor2-layer { transform: translateZ(0px); opacity: 1; z-index: 10; background: rgba(15, 23, 42, 1); }

        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(8px); z-index: 9999; align-items: center; justify-content: center; }
        .modal-overlay.active { display: flex; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from{opacity:0;transform:scale(0.95)} to{opacity:1;transform:scale(1)} }

        .custom-scroll::-webkit-scrollbar { width: 8px; height: 8px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background: var(--glass-border); border-radius: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb:hover { background: var(--text-sub); }

        /* ✅ CSS สำหรับกล่องค้นหาแบบย่อได้ (Minimize State) */
        /* กล่องผลการค้นหา: ยึดตำแหน่งกับกล่อง input โดยตรง (absolute แทน fixed)
           เดิมใช้ position:fixed ร่วมกับ width:100% ซึ่งสำหรับ fixed แล้ว 100% หมายถึง
           100% ของ "จอทั้งหมด" ไม่ใช่ของกล่องค้นหา ทำให้กล่องผลลัพธ์ยืดเต็มความกว้างหน้าจอ
           (เห็นเป็นแถบ/กรอบยาวคาดกลางจอ) เปลี่ยนเป็น absolute เทียบกับกล่องค้นหาโดยตรง
           จะได้ขนาดกะทัดรัด ไม่ล้นจอ และไม่มีกรอบเกินมาอีก */
        #searchResultsPanel {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            width: min(90vw, 320px);
        }
        #searchResultsPanel.minimized {
            top: 8px !important;
            left: auto !important;
            right: 0 !important;
            width: 140px !important;
            min-height: 40px !important;
            height: 44px !important;
            border-radius: 22px !important;
            overflow: hidden;
            display: flex !important;
            cursor: pointer;
        }
        #searchResultsPanel.minimized .full-header, 
        #searchResultsPanel.minimized #searchResultsContent { display: none !important; }
        #searchResultsPanel.minimized .min-header { display: flex !important; }
        .min-header { display: none; }

        @media (min-width: 768px) {
            #searchResultsPanel { width: 100%; max-width: 380px; }
        }

        /* ✅ อนุญาตให้ใช้สองนิ้วซูม และเลื่อนแผนที่ได้อิสระ */
        #scroll-wrapper { touch-action: pan-x pan-y; }
    </style>
</head>
<body class="h-screen flex flex-col select-none relative" data-theme="dark">

    <div class="mouse-glow"></div>

    <!-- 🌐 Top Navbar (Glassmorphism + KSS Logo) -->
    <div class="glass-panel sticky top-0 p-3 z-[60] border-b-0 m-3 rounded-2xl">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row gap-4 items-center justify-between">
            
            <div class="flex items-center gap-4 w-full md:w-auto">
                <a href="menu.html" class="flex items-center gap-2 px-4 py-2 rounded-xl text-[var(--text-main)] text-xs font-bold border border-[var(--glass-border)] bg-[var(--glass-bg)] hover:bg-[var(--card-hover)] hover:scale-105 shadow-sm transition-all duration-300">
                    <i class="fa-solid fa-house"></i> <span data-i18n="navMenu">เมนูหลัก</span>
                </a>
                
                <div class="flex items-center gap-2 group cursor-pointer">
                    <div class="relative flex items-center justify-center">
                        <div class="absolute inset-0 bg-red-500/20 blur-md rounded-full opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
                        <img src="logo.png" alt="KSS Logo" class="h-7 md:h-8 w-auto object-contain relative z-10 drop-shadow-sm transition-transform duration-300 group-hover:scale-110">
                    </div>
                    <h1 class="text-base font-black tracking-widest text-[var(--text-main)] flex items-center transition-colors group-hover:text-red-500">
                        KAOSU 3D <span class="text-[10px] text-[var(--text-sub)] font-bold ml-1 bg-[var(--input-bg)] border border-[var(--glass-border)] px-2 py-0.5 rounded shadow-inner">[v1.1.2]</span>
                    </h1>
                </div>
            </div>

            <!-- 🔍 Search Box (โครงสร้างกล่องย่อ-ขยายได้) -->
            <div class="relative w-full md:w-96">
                <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 transform -translate-y-1/2 text-[var(--text-sub)]"></i>
                <input type="text" id="searchInput" data-i18n-placeholder="searchPlaceholder" placeholder="ค้นหารหัสสินค้า, ชื่อ, รหัสช่อง (เช่น A1-05)..."
                    class="w-full glass-input rounded-full py-2.5 pl-12 pr-4 text-sm focus:outline-none focus:ring-2 focus:ring-sky-500 shadow-inner font-bold placeholder-[var(--text-sub)]">
                
                <!-- ✅ กล่องค้นหาที่อัปเกรดให้ย่อ/ขยายได้ -->
                <div id="searchResultsPanel" class="absolute top-full right-0 mt-2 max-h-[60vh] md:max-h-[320px] glass-input backdrop-blur-xl border border-[var(--glass-border)] rounded-xl shadow-2xl z-[100] flex flex-col hidden transition-all duration-300">
                    
                    <!-- โหมดขยาย (Full Header) -->
                    <div class="full-header bg-[var(--glass-bg)] text-[var(--text-main)] text-[11px] font-bold px-4 py-2.5 rounded-t-xl border-b border-[var(--glass-border)] flex justify-between items-center shadow-sm">
                        <span id="searchPanelTitle" class="text-sky-500"><i class="fa-solid fa-list-ul mr-1.5"></i> <span data-i18n="searchPanelDefaultTitle">สรุปผลการค้นหา</span></span>
                        <div class="flex gap-2 items-center">
                            <!-- ปุ่มย่อ (Minimize) -->
                            <button onclick="toggleMinimizeSearch()" class="text-[var(--text-sub)] hover:text-sky-500 transition-colors p-1" title="ย่อหน้าต่างเก็บ"><i class="fa-solid fa-compress text-sm"></i></button>
                            <!-- ปุ่มปิด (Close) -->
                            <button onclick="closeSearchPanel()" class="text-[var(--text-sub)] hover:text-red-500 transition-colors p-1"><i class="fa-solid fa-xmark text-base"></i></button>
                        </div>
                    </div>

                    <!-- โหมดย่อ (Minimized Header) จะแสดงตอนกดปุ่มย่อเท่านั้น -->
                    <div class="min-header w-full px-4 py-2 flex justify-between items-center cursor-pointer hover:bg-[var(--card-hover)] transition-colors rounded-full h-full" onclick="toggleMinimizeSearch()">
                        <span class="text-sky-500 text-[11px] font-bold flex items-center gap-1.5"><i class="fa-solid fa-magnifying-glass"></i> <span id="minSearchCount">0 รายการ</span></span>
                        <i class="fa-solid fa-expand text-[var(--text-sub)]"></i>
                    </div>

                    <div id="searchResultsContent" class="flex-1 overflow-y-auto p-2 space-y-2 custom-scroll"></div>
                </div>
            </div>

            <div class="flex items-center gap-2 flex-wrap justify-center w-full md:w-auto">
                <!-- Theme Switcher -->
                <div class="glass-input rounded-full px-3 py-1.5 flex items-center gap-2 shadow-inner">
                    <button onclick="changeTheme('light')" class="w-5 h-5 rounded-full bg-slate-200 border border-slate-300 shadow-sm transition-transform hover:scale-110 active:scale-95" title="Light Theme"></button>
                    <button onclick="changeTheme('dark')" class="w-5 h-5 rounded-full bg-slate-800 border border-slate-600 shadow-sm transition-transform hover:scale-110 active:scale-95" title="Dark Theme"></button>
                    <button onclick="changeTheme('kaosu')" class="w-5 h-5 rounded-full bg-red-800 border border-red-500 shadow-sm transition-transform hover:scale-110 active:scale-95" title="Kaosu Theme"></button>
                </div>
                <!-- Language Switcher -->
                <div class="glass-input rounded-full px-3 py-1.5 flex items-center gap-1.5 shadow-inner cursor-pointer hover:border-sky-400 transition-colors">
                    <i class="fa-solid fa-earth-asia text-sky-500 text-sm"></i>
                    <select id="globalLangSwitcher" onchange="changeLanguage(this.value)" class="bg-transparent text-[var(--text-main)] text-xs font-bold outline-none cursor-pointer appearance-none text-center pr-1 tracking-wider">
                        <option value="th" class="bg-slate-800 text-white">🇹🇭 TH</option>
                        <option value="zh" class="bg-slate-800 text-white">🇹🇼 ZH</option>
                        <option value="mm" class="bg-slate-800 text-white">🇲🇲 MM</option>
                        <option value="en" class="bg-slate-800 text-white">🇬🇧 EN</option>
                    </select>
                    <i class="fa-solid fa-chevron-down text-[var(--text-sub)] text-[9px] pointer-events-none ml-1"></i>
                </div>
                <!-- ✅ ปุ่มคำอธิบายสัญลักษณ์ (Legend) — ต้องกด/แตะเท่านั้นถึงจะเปิด ไม่เด้งตาม hover -->
                <button onclick="toggleLegend()" title="คำอธิบายสัญลักษณ์" class="w-9 h-9 flex items-center justify-center rounded-full glass-input text-sky-500 text-base shadow-sm hover:bg-[var(--card-hover)] transition-all active:scale-95">
                    <i class="fa-solid fa-circle-question"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- 🕹️ View Controls (ลอยอยู่ด้านล่าง ไม่บังแผนที่) -->
    <div class="absolute bottom-6 left-1/2 -translate-x-1/2 z-[60] flex justify-center gap-2 glass-panel p-1.5 md:p-2.5 rounded-2xl shadow-2xl border border-[var(--glass-border)] w-[90%] md:w-auto">
        <button onclick="changeView('3d')" id="btn-3d" class="bg-gradient-to-r from-sky-500 to-blue-600 text-white text-[10px] md:text-xs font-black px-3 md:px-5 py-2 md:py-2.5 rounded-xl shadow-lg transition-all active:scale-95 whitespace-nowrap flex-1 md:flex-none">
            <i class="fa-solid fa-layer-group"></i> <span data-i18n="btnOverview">ภาพรวม 3D</span>
        </button>
        <button onclick="changeView('f1')" id="btn-f1" class="glass-input hover:bg-[var(--card-hover)] text-[var(--text-main)] text-[10px] md:text-xs font-bold px-3 md:px-5 py-2 md:py-2.5 rounded-xl transition-all shadow-sm whitespace-nowrap flex-1 md:flex-none">
            <i class="fa-solid fa-arrow-down"></i> <span data-i18n="btnFocusF1">ชั้น 1</span>
        </button>
        <button onclick="changeView('f2')" id="btn-f2" class="glass-input hover:bg-[var(--card-hover)] text-[var(--text-main)] text-[10px] md:text-xs font-bold px-3 md:px-5 py-2 md:py-2.5 rounded-xl transition-all shadow-sm whitespace-nowrap flex-1 md:flex-none">
            <i class="fa-solid fa-arrow-up"></i> <span data-i18n="btnFocusF2">ชั้น 2</span>
        </button>
    </div>

    <!-- 🗺️ โครงสร้างแผนผัง 3D (โครงสร้างเดิมที่เพิ่มระบบ 2 นิ้วซูม) -->
    <div id="scroll-wrapper" class="flex-1 w-full overflow-auto relative custom-scroll z-10">
        <div id="spacer" class="relative flex justify-center md:items-center p-4 pt-12 md:p-10 min-w-max min-h-max transition-all">
            <div class="scene-container">
                <div id="scale-wrapper">
                    <div class="building-position-wrapper">
                        <div id="floorBadge" data-i18n="badgeOverview" class="floor-badge-outside bg-sky-900 text-sky-300 border border-sky-500">ภาพรวม 3 มิติ (ชั้น 1-2)</div>
                        <div id="building" class="building-3d state-3d">
                            <div id="floor1-layer" class="floor-layer"></div>
                            <div id="floor2-layer" class="floor-layer"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 🪟 Info Modal -->
    <div id="infoModal" class="modal-overlay" onclick="closeModal(event)">
        <div class="glass-panel rounded-3xl p-5 md:p-6 w-11/12 max-w-sm shadow-2xl m-auto relative overflow-hidden" onclick="event.stopPropagation()">
            <div class="absolute -top-10 -right-10 w-32 h-32 bg-sky-500/20 rounded-full blur-2xl"></div>
            <div class="flex justify-between items-center mb-4 relative z-10">
                <h3 id="modalTitle" class="text-2xl md:text-3xl font-black text-[var(--text-main)] tracking-wider drop-shadow-sm">A1-00</h3>
                <span id="modalStatusBadge" class="px-3 py-1.5 rounded-full text-[10px] font-black uppercase border border-[var(--glass-border)] shadow-sm">Status</span>

        function iconFor(type){
            if(type === 'lift') return '<i class="fa-solid fa-truck-ramp-box box-icon"></i>';
            if(type === 'roll') return '<i class="fa-solid fa-dolly box-icon"></i>';
            return '';
        }

        function rackHtml(loc){
            const id = loc.id || loc.val;
            const widthCols = loc.c2 - loc.c1 + 1;
            const narrow = widthCols === 1 && loc.val.length >= 4;
            const typeClass = loc.type === 'lift' ? ' type-lift' : '';
            return `<div class="rack-box${narrow ? ' narrow-vert' : ''}${typeClass}" id="box-${id}"
                style="grid-column:${loc.c1} / ${loc.c2+1}; grid-row:${loc.r1} / ${loc.r2+1};">${iconFor(loc.type)}<span>${loc.val}</span></div>`;
        }
        function otherHtml(loc){
            const cls = loc.type === 'toilet' ? 'toilet-box' : loc.type === 'void' ? 'void-box' : 'zone-box';
            const icon = loc.type === 'toilet' ? '<i class="fa-solid fa-restroom" style="font-size:10px;margin-right:2px;"></i>' : '';
            return `<div class="${cls}" style="grid-column:${loc.c1} / ${loc.c2+1}; grid-row:${loc.r1} / ${loc.r2+1};">${icon}<span>${loc.val}</span></div>`;
        }
        function rackGroupHtml(loc){
            const inner = loc.items.map(it => {
                const narrow = it.val.length >= 4;
                return `<div class="rack-box${narrow ? ' narrow-vert' : ''}" id="box-${it.id}"><span>${it.val}</span></div>`;
            }).join('');
            return `<div style="grid-column:${loc.c1} / ${loc.c2+1}; grid-row:${loc.r1} / ${loc.r2+1}; display:grid; grid-template-columns:repeat(${loc.items.length}, 1fr);">${inner}</div>`;
        }

        function renderFloor(containerId, data){
            const el = document.getElementById(containerId);
            let html = '';
            data.forEach(loc => {
                if(loc.type === 'rackgroup') html += rackGroupHtml(loc);
                else html += (loc.type === 'rack' || loc.type === 'lift' || loc.type === 'roll') ? rackHtml(loc) : otherHtml(loc);
            });
            el.innerHTML = html;
        }

        function initLayout() {
            renderFloor('floor1-layer', FLOOR1_DATA);
            renderFloor('floor2-layer', FLOOR2_DATA);
        }

        // ==========================================
        // 🔍 ระบบซูมด้วย 2 นิ้ว (Pinch-to-Zoom & Pan) — ปรับให้สมูทขึ้นด้วย requestAnimationFrame
        // ==========================================
        let currentScaleMultiplier = 1;
        let lastScaleMultiplier = 1;
        let initialPinchDistance = null;
        let pinchRafPending = false;

        const scrollWrapper = document.getElementById('scroll-wrapper');
        
        // ดักจับเมื่อเอานิ้วแตะจอ (Touch Start)
        scrollWrapper.addEventListener('touchstart', (e) => {
            if(e.touches.length === 2) {
                // คำนวณระยะห่างระหว่าง 2 นิ้ว
                initialPinchDistance = Math.hypot(
                    e.touches[0].pageX - e.touches[1].pageX,
                    e.touches[0].pageY - e.touches[1].pageY
                );
            }
        }, {passive: false});

        // ดักจับเมื่อขยับนิ้ว (Touch Move) เพื่อซูม
        scrollWrapper.addEventListener('touchmove', (e) => {
            if(e.touches.length === 2 && initialPinchDistance) {
                e.preventDefault(); // ป้องกันไม่ให้ Browser ทำการซูมมั่วๆ
                const currentDistance = Math.hypot(
                    e.touches[0].pageX - e.touches[1].pageX,
                    e.touches[0].pageY - e.touches[1].pageY
                );
                // คำนวณอัตราส่วนการขยาย
                const scaleChange = currentDistance / initialPinchDistance;
                currentScaleMultiplier = Math.max(0.5, Math.min(lastScaleMultiplier * scaleChange, 3)); // ล็อกการซูมไม่ให้เกิน 3 เท่า

                // ✅ รวมหลาย touchmove ที่ยิงถี่ๆ ให้อัปเดตแค่ 1 ครั้งต่อเฟรม (requestAnimationFrame)
                // ช่วยลดอาการกระตุก/หน่วงตอนบีบนิ้วซูมบนมือถือ
                if (!pinchRafPending) {
                    pinchRafPending = true;
                    requestAnimationFrame(() => {
                        resize3D();
                        pinchRafPending = false;
                    });
                }
            }
        }, {passive: false});

        // ดักจับเมื่อเอานิ้วออก (Touch End)
        scrollWrapper.addEventListener('touchend', (e) => {
            if(e.touches.length < 2) {
                initialPinchDistance = null;
                lastScaleMultiplier = currentScaleMultiplier; // จำค่าสเกลล่าสุดไว้
            }
        });

        // ฟังก์ชันคำนวณและปรับสเกล 3D
        function resize3D() {
            const wrapper = document.getElementById('scale-wrapper');
            const spacer = document.getElementById('spacer');
            const cell = 22;
            const totalWidth = cell * 47;
            const totalHeight = cell * 30;
            const w = window.innerWidth;
            const isMobile = w < 768;

            let baseScale;
            if (isMobile) {
                baseScale = Math.max((w - 24) / totalWidth, 0.65);
                let finalScale = baseScale * currentScaleMultiplier; // นำค่าที่ซูมมาคูณ
                wrapper.style.transformOrigin = "top left";
                spacer.style.display = "block";
                spacer.style.width = `${totalWidth * finalScale + 40}px`;
                spacer.style.height = `${totalHeight * finalScale + 100}px`;
                wrapper.style.transform = `scale(${finalScale})`;
            } else {
                baseScale = (w - 24) / totalWidth;
                baseScale = Math.min(1.3, Math.max(baseScale, 0.48));
                let finalScale = baseScale * currentScaleMultiplier; // นำค่าที่ซูมมาคูณ
                wrapper.style.transformOrigin = "center center";
                spacer.style.display = "flex";
                spacer.style.width = "100%";
                spacer.style.height = "100%";
                wrapper.style.transform = `scale(${finalScale})`;
            }
        }
        window.addEventListener('resize', resize3D);

        document.getElementById('searchInput').addEventListener('input', e => {
            const term = e.target.value.trim().toUpperCase();
            document.querySelectorAll('.highlight-blink').forEach(el => el.classList.remove('highlight-blink'));

            const panel = document.getElementById('searchResultsPanel');
            const content = document.getElementById('searchResultsContent');
            const panelTitle = document.getElementById('searchPanelTitle');
            const minCount = document.getElementById('minSearchCount'); // ตัวแปรอัปเดตยอดค้นหาตอนย่อ
            const t = translations[currentLang] || translations.th;

            if(!term) {
                closeSearchPanel();
                return;
            }

            let html = '';
            let foundCount = 0;

            for(const [locId, data] of Object.entries(locationData)) {
                let iArr = (data.items_list || "").split(',').map(s=>s.trim()).filter(s=>s!=="");

                let matchedItems = iArr.filter(itemCode => {
                    let mData = masterData[itemCode.toUpperCase()] || {};
                    let codeName = (mData.code_name || "").toUpperCase();
                    let cl = (mData.cl || "").toUpperCase();

                    return itemCode.toUpperCase().includes(term) ||

                });

                if(matchedItems.length > 0 || locId.toUpperCase().includes(term)) {

                    boxIdsFor(locId).forEach(id => {

                        if(b) b.classList.add('highlight-blink');

                    let itemsToDisplay = matchedItems.length > 0 ? matchedItems : iArr;

                            </div>
                        </div>`;

                    html += `</div>`;
                    foundCount++;

            panel.classList.remove('minimized');

            if(foundCount > 0) {
                content.innerHTML = html;
                panelTitle.innerHTML = `<i class="fa-solid fa-list-ul mr-1.5"></i> ${t.searchFoundPrefix} ${foundCount} ${t.searchFoundSuffix}`;
